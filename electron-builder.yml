appId: com.myrouter.app
productName: Alto AI
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{HANDOFF.md,*.tgz,*.tsbuildinfo,.env.example}'
  - '!{dist-installer,release,out-test,.git}/**'
  - '!*.{log,apk}'
  - '!build-*.txt'
  - '!{mobile,relay,tests,scripts,.github,.vscode}/**'
extraResources:
  - from: src/skills/delegate-skills
    to: skills
  - from: src/mcp/config.json
    to: mcp/config.json
asarUnpack:
  - resources/**
win:
  executableName: alto-ai
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Alto-AI-${version}-setup.${ext}
  shortcutName: Alto AI
  uninstallDisplayName: Alto AI
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  executableName: alto-ai
  target:
    - AppImage
    - deb
  maintainer: Tarek Nahas <tareknahas@live.com>
  category: Utility
  icon: build/icon.png
  executableArgs:
    - --no-sandbox
  desktop:
    entry:
      Name: Alto AI
      Comment: Multi-model AI agent router with MCP connectors
      Categories: Utility;Development;
  artifactName: Alto AI-${version}-linux.${ext}
appImage:
  artifactName: Alto AI-${version}-linux.${ext}
npmRebuild: false
publish:
  provider: github
  owner: tareknahas85-star
  repo: Alto-AI
  releaseType: release
