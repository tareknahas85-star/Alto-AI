name = "trl-agent-gate"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
# setup-cloud.ps1 overrides this with --var; a plain `wrangler deploy` now keeps the right repo instead of a 404.
GH_REPO = "tareknahas85-star/Alto-AI"

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gate"]
