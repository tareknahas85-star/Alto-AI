name: Release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the files to (e.g. v5.9.8)
        required: true
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux AppImage deb --publish never
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.inputs.tag }}" release/Alto-AI-*-linux.* --clobber
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win nsis --publish never
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls release/Alto-AI-*-setup.exe | head -1)
          v=$(echo "$f" | sed -E 's/.*Alto-AI-(.*)-setup.exe/\1/')
          cp "$f" "release/Alto-AI-$v-windows-setup.exe"
          gh release upload "${{ github.event.inputs.tag }}" "release/Alto-AI-$v-windows-setup.exe" --clobber
  checksums:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir dl && cd dl
          gh release download "${{ github.event.inputs.tag }}" --pattern 'Alto-AI-*'
          sha256sum Alto-AI-* > SHA256SUMS.txt
          gh release upload "${{ github.event.inputs.tag }}" SHA256SUMS.txt --clobber